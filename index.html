      body {

      .gradient-text {

      /* Starfield Background */
      .stars, .stars2, .stars3 {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: transparent;
        z-index: -2;

      .stars { background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px); background-size: 550px 550px; opacity: 0.3; }

      .stars3 { background-image: radial-gradient(#22d3ee, rgba(34,211,238,.2) 2px, transparent 3px); background-size: 250px 250px; opacity: 0.2; animation: moveStars 50s linear infinite; }

      @keyframes moveStars {
        from { transform: translateY(0); }

      }

      /* 3D Visuals */
      .perspective-1000 {

      }
      .transform-style-3d {

      }
      .animate-spin-slow {

      }
      @keyframes spin-3d {
        0% { transform: rotateX(60deg) rotateZ(0deg); }
        100% { transform: rotateX(60deg) rotateZ(360deg); }
      }
      
      /* Scrolling Animation for Client Logos */
      @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-scroll {
        animation: scroll 40s linear infinite;
      }
      .animate-scroll:hover {
        animation-play-state: paused;
      }
      
      /* Service Card 3D Tilt */
      .card-3d-hover {
        transition: transform 0.3s ease, box-shadow 0.3s ease;

      }
